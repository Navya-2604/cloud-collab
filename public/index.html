<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CloudCollab — Home</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      overflow: hidden;
    }

    h1 {
      font-size: 3rem;
      font-weight: 700;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      max-width: 600px;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    .btn-group {
      display: flex;
      gap: 1rem;
    }

    button {
      background: white;
      color: #5a67d8;
      border: none;
      padding: 0.8rem 1.5rem;
      font-size: 1rem;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.3s ease;
    }

    button:hover {
      background: #5a67d8;
      color: white;
      transform: translateY(-3px);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
    }

    footer {
      position: absolute;
      bottom: 15px;
      font-size: 0.85rem;
      opacity: 0.8;
    }
  </style>
</head>
<body>

  <h1>☁️ CloudCollab</h1>
  <p>
    A Cloud-Based Document Collaboration System that allows multiple users to create, edit, and share documents in real-time.
  </p>

  <div class="btn-group">
    <button onclick="window.location.href='./login.html'">Login</button>
    <button onclick="window.location.href='./signup.html'">Sign Up</button>
  </div>

  <footer>© 2025 CloudCollab Project | VTU Mini Project</footer>

  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js")
        .then(reg => console.log("✅ SW Registered:", reg.scope))
        .catch(err => console.log("❌ SW Error:", err));
    }
  </script>

</body>
</html>
