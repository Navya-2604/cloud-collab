<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Realtime Editor — CloudCollab</title>

<style>
    body {
        font-family: "Poppins", sans-serif;
        background: #f7fafc;
        margin: 0;
    }

    header {
        background: linear-gradient(90deg, #667eea, #764ba2);
        padding: 1.2rem 2rem;
        display: flex;
        justify-content: space-between;
        align-items: center;
        color: white;
    }

    #backBtn {
        background: #ff5c5c;
        border: none;
        padding: 10px 18px;
        border-radius: 10px;
        color: white;
        cursor: pointer;
        font-size: 14px;
        transition: 0.2s;
    }

    #backBtn:hover {
        background: #d64545;
    }

    textarea {
        width: 95%;
        height: 80vh;
        margin: 20px auto;
        display: block;
        padding: 20px;
        font-size: 16px;
        border-radius: 12px;
        border: 1px solid #ddd;
        resize: none;
        outline: none;
    }

    .status {
        margin-left: 30px;
        color: rgb(10, 155, 10);
        font-size: 13px;
    }
</style>
</head>

<body>

<header>
    <h2>Document Editor</h2>
    <button id="backBtn">Back to Dashboard</button>
</header>

<textarea id="editor"></textarea>
<p class="status" id="saveStatus">All changes saved ✅</p>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-firestore.js"></script>

<!-- Firebase config and services -->
<script src="firebase.js"></script>

<script>
// 🚀 Prevent unauthorised access
firebase.auth().onAuthStateChanged(user => {
    if (!user) {
        window.location.href = "login.html";
    }
});

// ✅ EDITOR LOGIC
const editor = document.getElementById("editor");
const saveStatus = document.getElementById("saveStatus");

const docRef = db.collection("documents").doc("realtime-doc"); // (same doc for all users)

// Load existing content
docRef.get().then(doc => {
    if (doc.exists) editor.value = doc.data().content || "";
});

// Save in realtime (debounce)
let typingTimer;
editor.addEventListener("input", () => {
    saveStatus.innerText = "Saving...";

    clearTimeout(typingTimer);
    typingTimer = setTimeout(() => {
        docRef.set({ content: editor.value });
        saveStatus.innerText = "All changes saved ✅";
    }, 400);
});

// ✅ Listen for updates from others (real-time sync)
docRef.onSnapshot(doc => {
    if (doc.exists) {
        if (editor.value !== doc.data().content) {
            editor.value = doc.data().content;
        }
    }
});

// ✅ BACK TO DASHBOARD BUTTON (working now)
document.getElementById("backBtn").addEventListener("click", () => {
    window.location.href = "dashboard.html";
});
</script>

</body>
</html>
