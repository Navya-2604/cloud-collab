<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard — CloudCollab</title>

    <style>
        body {
            font-family: "Poppins", sans-serif;
            background: #f7fafc;
            margin: 0;
            padding: 0;
        }

        header {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .btn {
            background: #4a90e2;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            color: white;
            cursor: pointer;
            margin-left: 10px;
            transition: 0.2s;
            font-size: 14px;
        }

        .btn:hover {
            background: #3272c3;
        }

        .logout-btn {
            background: #ff5c5c;
        }

        .logout-btn:hover {
            background: #d64545;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 78vh;
            gap: 1.2rem;
        }

        .card {
            width: 350px;
            padding: 20px;
            background: white;
            border-radius: 14px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-size: 18px;
            font-weight: bold;
        }

        .card:hover {
            transform: scale(1.04);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <header>
        <h2>CloudCollab Dashboard</h2>
        <div>
            <button class="btn" id="newDocBtn">+ New Document</button>
            <button class="btn logout-btn" onclick="logout()">Logout</button>
        </div>
    </header>

    <div class="container">
        <div class="card" onclick="window.location.href='mydocs.html'">My Documents</div>
        <div class="card" onclick="window.location.href='sharedocs.html'">Shared with Me</div>
    </div>

    <!-- Firebase Authentication -->
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-auth.js"></script>
    <script src="firebase.js"></script>

    <script>
        firebase.auth().onAuthStateChanged(user => {
            if (!user) {
                window.location.href = "login.html";
            }
        });

        document.getElementById("newDocBtn").addEventListener("click", () => {
            window.location.href = "realtime.html";
        });

        function logout() {
            firebase.auth().signOut().then(() => {
                alert("Logged out successfully.");
                window.location.href = "login.html";
            });
        }
    </script>

</body>

</html>
